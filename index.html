<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Split Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column. Week strip on top selects the day, exercise cards with per-set inputs below, fixed save bar at the bottom. */
:root {
  --bg: #f1f4f7;
  --surface: #ffffff;
  --surface-2: #e8edf2;
  --line: #d3dae2;
  --fg: #11171d;
  --muted: #566370;
  --accent: #d9480f;
  --accent-fg: #ffffff;
  --accent-soft: #fbe3d6;
  --ok: #1f7a52;
  --warn: #a15c00;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1217;
    --surface: #151b22;
    --surface-2: #1d252e;
    --line: #2b3541;
    --fg: #e7ecf1;
    --muted: #8f9cab;
    --accent: #ff7a33;
    --accent-fg: #1c0d03;
    --accent-soft: #3a2314;
    --ok: #4cc38a;
    --warn: #e8b04a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1217;
  --surface: #151b22;
  --surface-2: #1d252e;
  --line: #2b3541;
  --fg: #e7ecf1;
  --muted: #8f9cab;
  --accent: #ff7a33;
  --accent-fg: #1c0d03;
  --accent-soft: #3a2314;
  --ok: #4cc38a;
  --warn: #e8b04a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 140px;
}
.app { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 32px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.today { font-family: var(--mono); font-size: 13px; color: var(--muted); }

.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 4px 9px; margin-right: 14px; font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--mono); font-size: 12px; margin-left: 6px; color: var(--muted); }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.chip .dow { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.chip .nm { font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .02em; line-height: 1.1; white-space: nowrap; }
.chip.rest .nm { color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.chip[aria-pressed="true"] .dow, .chip[aria-pressed="true"] .nm { color: var(--accent-fg); }
.chip .tick { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.chip.is-today .tick { background: var(--accent); }
.chip[aria-pressed="true"].is-today .tick { background: var(--accent-fg); }

.dayhead { display: flex; flex-direction: column; gap: 2px; }
.dayhead h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 38px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; text-wrap: balance; }
.dayhead p { margin: 0; color: var(--muted); font-size: 14px; }
.note { border: 1px dashed var(--line); border-radius: 6px; padding: 10px 12px; color: var(--muted); font-size: 14px; }
.note strong { color: var(--fg); font-weight: 600; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.exhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.exhead h3 { margin: 0; font-size: 16px; font-weight: 600; min-width: 0; text-wrap: balance; }
.target { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.cue { margin: 0; font-size: 13px; color: var(--muted); }
.hint { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.try { margin: 0; font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
.try b { font-weight: 600; }
.try.add b { color: var(--accent); }
.try .why { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: 2rem repeat(var(--cols), minmax(0, 1fr)); gap: 8px; align-items: center; }
.colhead { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: center; }
.setn { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.inp { width: 100%; min-width: 0; height: 44px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); padding: 0 8px; text-align: center; font-family: var(--mono); font-weight: 500; font-size: 17px; }
.inp::placeholder { color: var(--muted); opacity: .55; font-weight: 400; }
.exbar { display: flex; flex-wrap: wrap; gap: 8px; }
.addset { align-self: flex-start; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.addset:hover { color: var(--fg); border-color: var(--muted); }
.addset[aria-expanded="true"] { color: var(--fg); border-color: var(--accent); }
.swapbox { display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--line); padding-top: 10px; }
.swapbox label { font-size: 13px; color: var(--muted); }
.swapnote { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--accent); }
.plan { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; margin: 0; font-size: 13px; }
.plan dt { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.plan dd { margin: 0; overflow-wrap: anywhere; }
.inp.warm { background: transparent; border-style: dashed; }
.setn.w { color: var(--accent); font-weight: 600; }
.note + .note { margin-top: -6px; }

.knee { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.knee h3 { margin: 0; font-size: 16px; font-weight: 600; }
.knee label { font-size: 13px; color: var(--muted); }
.sel { height: 44px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); padding: 0 10px; font-family: var(--mono); font-size: 16px; max-width: 12rem; }
.sel.wide { max-width: none; width: 100%; }

.savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5; }
.savebar .in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tally { font-family: var(--mono); font-size: 13px; color: var(--muted); min-width: 0; }
.tally b { color: var(--fg); font-weight: 600; }
.btn { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 6px; height: 46px; padding: 0 22px; font-family: var(--display); font-weight: 700; font-size: 21px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.btn:disabled { opacity: .45; cursor: default; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 6px; font-size: 14px; z-index: 6; max-width: calc(100vw - 32px); }
.toast.err { background: var(--warn); color: var(--bg); }

.histnote { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; }
.empty h3 { margin: 0; font-family: var(--display); font-size: 26px; letter-spacing: .03em; text-transform: uppercase; font-weight: 700; }
.empty p { margin: 0; color: var(--muted); }
.sess { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.sesshead { width: 100%; background: none; border: 0; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; }
.sesshead .l { display: flex; flex-direction: column; min-width: 0; }
.sesshead .t { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: .03em; text-transform: uppercase; line-height: 1.1; }
.sesshead .d { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.sesshead .r { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.sessbody { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.hx { display: flex; flex-direction: column; gap: 1px; }
.hx .n { font-size: 14px; font-weight: 600; }
.hx .s { font-family: var(--mono); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.kneeline { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 13px; color: var(--muted); }
.kneeline .sel { height: 36px; font-size: 14px; }
.del { align-self: flex-start; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.del.sure { border-color: var(--warn); color: var(--warn); }

@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
}
@media (max-width: 380px) {
  .dayhead h2 { font-size: 32px; }
  .btn { padding: 0 16px; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">Split Log</div>
    <div class="today" id="today"></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" id="tab-log" aria-selected="true" aria-controls="view-log">Log</button>
    <button class="tab" role="tab" id="tab-hist" aria-selected="false" aria-controls="view-hist">History<span class="count" id="histcount"></span></button>
  </nav>

  <section id="view-log" role="tabpanel" aria-labelledby="tab-log" class="stack" style="gap:18px">
    <div class="week" id="week" role="group" aria-label="Pick a day"></div>
    <div id="daybody" class="stack" style="gap:18px"></div>
  </section>

  <section id="view-hist" role="tabpanel" aria-labelledby="tab-hist" class="stack" hidden>
    <p class="histnote" id="histnote"></p>
    <div id="history" class="stack"></div>
  </section>
</div>

<div class="savebar" id="savebar">
  <div class="in">
    <div class="tally" id="tally"></div>
    <button class="btn" id="savebtn" type="button">Save session</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  "use strict";

  /* ---------- plan ---------- */
  /* up = what to add when every set hits the top of the range. The first number in it is the step used for weight suggestions.
     warm = warm-up set as a share of the working weight. */
  var RUN_EX = [
    { id: "wallsit", name: "Wall sit", sets: 3, lo: 30, hi: 45, timed: true, up: "a light plate on your lap",
      cue: "Knees at about 90 degrees. Enter seconds. Stop if you feel sharp knee pain." },
    { id: "reardelt", name: "Reverse pec deck fly (rear shoulders)", sets: 3, lo: 12, hi: 15, up: "2.5 kg", cue: "Face the pad, arms level with shoulders, squeeze your shoulder blades." },
    { id: "forearm", name: "Forearm curl", sets: 3, lo: 12, hi: 15, up: "2.5 kg", cue: "Slow on the way down." },
    { id: "hammer", name: "Hammer curl (biceps + top of forearm)", sets: 2, lo: 10, hi: 12, up: "1 to 2 kg per dumbbell",
      cue: "Palms face each other the whole time. 3 seconds down. Log the weight of one dumbbell." },
    { id: "deadhang", name: "Dead hang", sets: 2, lo: 20, hi: 40, timed: true, up: "5 s per hold",
      cue: "Enter seconds. End the hold when your grip or form goes." }
  ];
  var ABS_EX = [
    { id: "coremachine", name: "Abs machine (core machine crunch)", sets: 3, lo: 10, hi: 15, up: "2.5 kg",
      cue: "Curl your ribs toward your pelvis. Slow on the way back." },
    { id: "kneeraise", name: "Leg raise (vertical leg raise station)", sets: 3, lo: 10, hi: 15, up: "a light ankle weight, or a dumbbell between your feet",
      cue: "Knees bent. Curl your pelvis up at the top so your abs do the work, not your hip flexors. 2 seconds down." }
  ];
  var WED_EX = RUN_EX.concat([ABS_EX[0]]);
  var SAT_EX = RUN_EX.concat([ABS_EX[1]]);
  var PLAN = {
    upperA: { label: "Upper A", sub: "Chest, back, arms", ex: [
      { id: "bench", name: "Flat chest press (convergent machine)", sets: 3, lo: 8, hi: 12, up: "2.5 kg", warm: { pct: 50, r: "8" } },
      { id: "incline", name: "Incline convergent press", sets: 3, lo: 8, hi: 12, up: "2.5 kg" },
      { id: "pulldown", name: "Lat pulldown", sets: 3, lo: 8, hi: 12, up: "2.5 kg", warm: { pct: 50, r: "8" } },
      { id: "row", name: "Seated row machine (neutral grip)", sets: 3, lo: 8, hi: 12, up: "2.5 kg",
        cue: "Palms face each other, chest against the pad, elbows close to your body. Pull your elbows back, squeeze your shoulder blades for 1 second, 2 seconds back out." },
      { id: "lateral", name: "Standing lateral raise", sets: 4, lo: 12, hi: 15, up: "1 to 2.5 kg", cue: "Raise to shoulder height, 2-3 seconds down." },
      { id: "preacher", name: "Incline dumbbell curl", sets: 3, lo: 10, hi: 12, up: "1 to 2 kg per dumbbell",
        cue: "Bench at about 45-60 degrees, arms hanging straight down. Log the weight of one dumbbell. Take 3 seconds going down and get a full stretch at the bottom." },
      { id: "ohtri", name: "Overhead cable triceps extension", sets: 3, lo: 10, hi: 12, up: "2.5 kg",
        cue: "Take 3 seconds going down. Get a full stretch at the bottom." }
    ] },
    lowerA: { label: "Lower A", sub: "Quads, hamstrings, calves", lower: true, ex: [
      { id: "hack", name: "Hack squat", sets: 3, lo: 8, hi: 12, knee: true, up: "1.25 kg per side", warm: { pct: 50, r: "8" },
        cue: "Log the weight on each side. 3 seconds down, 3 seconds up, pain-free depth." },
      { id: "split", name: "Split squat", sets: 3, lo: 8, hi: 12, perLeg: true, knee: true, unit: "lb", shared: true, up: "2.5 lb each", warm: { bw: true, r: "6" },
        cue: "Right leg first, match the left to the right. 3 seconds down, 3 seconds up." },
      { id: "legext", name: "Leg extension", sets: 3, lo: 10, hi: 15, knee: true, up: "2.5 kg", partial: true,
        cue: "Bottom-to-mid reps: start with knees bent about 90 degrees (stretched position), lift only to about halfway, 3 seconds down. Do not lock out. Stop if knee pain goes above 3 out of 10." },
      { id: "hamcurl", name: "Hamstring curl", sets: 4, lo: 10, hi: 12, up: "2.5 kg" },
      { id: "calf", name: "Calf raise (leg press or Smith)", sets: 5, lo: 10, hi: 15, up: "5 kg", cue: "Pause 1 second at the bottom." }
    ] },
    calves: { label: "Run + Mini Session", sub: "Easy run, wall sit, rear shoulders, forearms, biceps, dead hang, abs",
      note: "Easy run first, 25-35 minutes at a talking pace. Skip the run if your knee is above 3 out of 10. Then the wall sit, then the light sets, then abs last.",
      ex: WED_EX },
    satmini: { label: "Run + Mini Session", sub: "Easy run, wall sit, rear shoulders, forearms, biceps, dead hang, abs",
      note: "Easy run first, 25-35 minutes at a talking pace. Skip the run if your knee is above 3 out of 10. Then the wall sit, then the light sets, then abs last. Sunday is your full rest day.",
      ex: SAT_EX },
    upperB: { label: "Upper B", sub: "Shoulders, back, arms, extra chest", ex: [
      { id: "shpress", name: "Shoulder press", sets: 3, lo: 8, hi: 10, up: "2.5 kg", warm: { pct: 50, r: "8" } },
      { id: "pecdeck", name: "Pec deck fly", sets: 3, lo: 12, hi: 15, up: "2.5 kg", cue: "Squeeze for 1 second in the middle, 3 seconds back out. If it is taken, use an incline dumbbell fly." },
      { id: "pullup", name: "Pull-up (bodyweight)", sets: 3, lo: 6, hi: 10, up: "a few kg, such as a dumbbell held between your feet", warm: { bw: true, r: "4" },
        cue: "Weight means extra weight added. Leave it blank for bodyweight. Chin over the bar, full stretch at the bottom, 2 seconds down. Stop each set 1-2 reps before you cannot do another." },
      { id: "rowB", name: "Seated row machine (overhand grip)", sets: 3, lo: 8, hi: 12, up: "2.5 kg",
        cue: "Palms face down, chest against the pad, elbows wide at about shoulder height. Pull your elbows back, squeeze your shoulder blades for 1 second, 2 seconds back out. This version works your rear shoulders and upper back more." },
      { id: "lateral", name: "Standing lateral raise", sets: 3, lo: 12, hi: 15, up: "1 to 2.5 kg" },
      { id: "cablecurl", name: "Cable curl", sets: 2, lo: 12, hi: 15, up: "2.5 kg" },
      { id: "dips", name: "Dips", sets: 2, lo: 8, hi: 12, up: "2.5 kg", cue: "Lean forward, elbows slightly out, to work the chest. Lower until upper arms are level with the floor. Weight 0 means bodyweight." },
      { id: "ohtriB", name: "Overhead cable triceps extension", sets: 3, lo: 10, hi: 12, up: "2.5 kg", cue: "Take 3 seconds going down. Get a full stretch at the bottom. If the cable is taken, use a dumbbell overhead extension with both hands." }
    ] },
    lowerB: { label: "Lower B", sub: "Quads, back, hamstrings, calves", lower: true, ex: [
      { id: "legpress", name: "Leg press", sets: 3, lo: 8, hi: 12, knee: true, unit: "lb", up: "5 lb per side", warm: { pct: 50, r: "8" },
        cue: "Log the weight on each side. 3 seconds down, 3 seconds up, pain-free depth." },
      { id: "split", name: "Split squat", sets: 3, lo: 8, hi: 12, perLeg: true, knee: true, unit: "lb", shared: true, up: "2.5 lb each", warm: { bw: true, r: "6" },
        cue: "Right leg first, match the left to the right. 3 seconds down, 3 seconds up." },
      { id: "backext", name: "Back extension", sets: 3, lo: 10, hi: 12, up: "2.5 kg" },
      { id: "hamcurl", name: "Hamstring curl", sets: 4, lo: 12, hi: 15, up: "2.5 kg" },
      { id: "calfseat", name: "Seated calf raise (Smith, bench under the bar)", sets: 5, lo: 12, hi: 20, up: "5 kg",
        cue: "Sit on a bench with the bar (padded with a towel) across your lower thighs, knees bent about 90 degrees. Pause 1 second at the bottom. Bent knees train the deeper calf muscle (soleus)." }
    ] }
  };
  var WEEK = [
    { dow: 1, id: "upperA", short: "Up A" },
    { dow: 2, id: "lowerA", short: "Low A" },
    { dow: 3, id: "calves", short: "Run" },
    { dow: 4, id: "upperB", short: "Up B" },
    { dow: 5, id: "lowerB", short: "Low B" },
    { dow: 6, id: "satmini", short: "Run" },
    { dow: 0, kind: "rest", short: "Rest" }
  ];
  var DOW_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var RESTINFO = {
    rest: { title: "Rest day", text: "Full rest. No lifting and no running. Eat well and sleep 7-9 hours." }
  };

  /* Every exercise in the plan, once, for the swap dropdown. CAT maps id -> definition (first day it appears in).
     GROUPS lists ids by day label, in week order. */
  var CAT = {};
  var GROUPS = [];
  (function () {
    var byLabel = {};
    WEEK.forEach(function (w) {
      if (!w.id) return;
      var day = PLAN[w.id];
      var g = byLabel[day.label];
      if (!g) { g = { label: day.label, ids: [] }; byLabel[day.label] = g; GROUPS.push(g); }
      day.ex.forEach(function (ex) {
        if (CAT[ex.id]) return;
        CAT[ex.id] = ex;
        g.ids.push(ex.id);
      });
    });
  })();

  /* How many sessions to keep for suggestions. History shows the latest 7. */
  var KEEP = 60;
  var SHOW = 7;

  /* ---------- helpers ---------- */
  function $(s) { return document.querySelector(s); }
  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.indexOf("on") === 0) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else if (v !== false && v != null) el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      kids.forEach(function (kid) {
        if (kid == null || kid === false) return;
        el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      });
    }
    return el;
  }
  function num(v) { var n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; }
  function int(v) { var n = parseInt(String(v), 10); return isFinite(n) ? n : 0; }
  function fmtW(x) { return String(Math.round(x * 100) / 100); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function fmtDate(ts) {
    return new Date(ts).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" }) +
      ", " + new Date(ts).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
  }
  function fmtKg(v) { return (Math.round(v) || 0).toLocaleString("en-IN"); }

  /* ---------- state ---------- */
  var now = new Date();
  var selected = pickDefaultDay();   // a key of WEEK
  var tab = "log";
  var sessions = [];                 // newest first, up to KEEP
  var store = null;
  var draft = { sets: {}, warm: {}, swap: {}, knee: "" };
  var open = {};
  var swapOpen = {};
  var sureDel = null;
  var saving = false;
  var toastTimer = null;

  function pickDefaultDay() {
    var d = now.getDay();
    for (var i = 0; i < 7; i++) {
      var dow = (d + i) % 7;
      for (var j = 0; j < WEEK.length; j++) {
        if (WEEK[j].dow === dow && WEEK[j].id) return j;
      }
    }
    return 0;
  }
  function curId() { return WEEK[selected].id || null; }

  /* ---------- swaps (this session only) ---------- */
  /* draft.swap maps a planned exercise id (the slot) to the id of the exercise used in its place today.
     It lives in the draft, so it survives a reload, and it is dropped when the session is saved. */
  function activeEx(slot) {
    var t = draft.swap && draft.swap[slot.id];
    return t && CAT[t] ? CAT[t] : slot;
  }
  function activeList(dayId) { return PLAN[dayId].ex.map(activeEx); }
  function cleanSwaps(dayId, sw) {
    var slots = PLAN[dayId].ex, out = {}, seen = {}, ok = true;
    slots.forEach(function (slot) {
      var t = sw && sw[slot.id];
      if (typeof t === "string" && t !== slot.id && CAT[t]) out[slot.id] = t;
    });
    slots.forEach(function (slot) {
      var a = out[slot.id] || slot.id;
      if (seen[a]) ok = false;
      seen[a] = true;
    });
    return ok ? out : {};
  }
  function hasData(ex) {
    return (draft.sets[ex.id] || []).some(function (s) { return int(s.r) > 0 || int(s.l) > 0; });
  }

  /* ---------- draft ---------- */
  function blankSets(ex) {
    var a = [];
    for (var i = 0; i < ex.sets + (ex.drop ? 1 : 0); i++) a.push({ w: "", r: "", l: "" });
    return a;
  }
  function newDraft() { return { sets: {}, warm: {}, swap: {}, knee: "" }; }
  function ensureEx(ex) {
    var want = ex.sets + (ex.drop ? 1 : 0);
    if (!draft.sets[ex.id] || !draft.sets[ex.id].length) draft.sets[ex.id] = blankSets(ex);
    else while (draft.sets[ex.id].length < want) draft.sets[ex.id].push({ w: "", r: "", l: "" });
    if (ex.warm && !draft.warm[ex.id]) draft.warm[ex.id] = { w: "", r: "", l: "" };
  }
  function loadDraft() {
    var id = curId();
    draft = newDraft();
    if (!id) return;
    var raw = lsGet("splitlog.draft." + id);
    if (raw) { try { var p = JSON.parse(raw); if (p && p.sets) draft = p; } catch (e) {} }
    if (!draft.warm) draft.warm = {};
    draft.swap = cleanSwaps(id, draft.swap);
    activeList(id).forEach(ensureEx);
  }
  var draftTimer = null;
  function flushDraft() {
    clearTimeout(draftTimer);
    var id = curId();
    if (id) lsSet("splitlog.draft." + id, JSON.stringify(draft));
  }
  function persistDraft() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(flushDraft, 300);
  }

  /* ---------- history and suggestions ---------- */
  var LB = 0.4536;
  /* Most recent session that logged this exercise. Same day first (or any day for shared exercises),
     otherwise the most recent session on any day, flagged cross. */
  function lastFor(dayId, ex) {
    var any = null;
    for (var i = 0; i < sessions.length; i++) {
      var s = sessions[i];
      if (!(s.sets && s.sets[ex.id] && s.sets[ex.id].length)) continue;
      if (s.dayId === dayId || ex.shared) return { s: s, cross: false };
      if (!any) any = s;
    }
    return any ? { s: any, cross: true } : null;
  }
  /* First number in the "up" text, e.g. "2.5 kg" -> 2.5, "1 to 2.5 kg" -> 1. Null when the text has no number. */
  function stepOf(ex) {
    if (ex.timed) return null;
    var m = /^\s*(\d+(?:\.\d+)?)/.exec(ex.up || "");
    return m ? parseFloat(m[1]) : null;
  }
  /* What to try today, from the last logged session of this exercise. Null when there is no history. */
  function suggest(dayId, ex) {
    var f = lastFor(dayId, ex);
    if (!f) return null;
    var s = f.s, arr = s.sets[ex.id], unit = ex.unit || "kg";
    var W = 0;
    arr.forEach(function (x) { if ((x.w || 0) > W) W = x.w; });
    var top = arr.filter(function (x) { return (x.w || 0) === W; }).slice(0, ex.sets);
    var minR = Infinity;
    top.forEach(function (x) {
      minR = Math.min(minR, x.r || 0);
      if (ex.perLeg) minR = Math.min(minR, x.l || 0);
    });
    if (!top.length || !isFinite(minR)) return null;
    var step = stepOf(ex);
    var rep = ex.timed ? " s" : " reps";
    var per = ex.perLeg ? " per leg" : "";
    var full = top.length >= ex.sets && minR >= ex.hi;
    var aim = Math.min(ex.hi, minR + (ex.timed ? 5 : 1));
    var sg = {
      kind: "hold", work: W, pw: W ? fmtW(W) : "", pr: String(aim),
      text: "Try " + (W ? fmtW(W) + " " + unit : "bodyweight") + " × " + aim + rep + per,
      note: minR < ex.lo
        ? "Under the " + ex.lo + rep + " floor last time. Repeat this weight. If you miss again, drop one step."
        : "Same weight until every set reaches " + ex.hi + rep + "."
    };
    if (!full) return sg;
    if (ex.knee && s.knee != null && s.knee > 3) {
      sg.note = "Top of range hit, but your knee reached " + s.knee + "/10. Hold this weight.";
    } else if (ex.knee && s.kneeNext != null && s.kneeNext > 0) {
      sg.note = "Top of range hit, but your knee was " + s.kneeNext + "/10 the next morning. Hold this weight.";
    } else if (ex.knee && s.kneeNext == null) {
      sg.kind = "cond";
      sg.note = "Top of range hit. " + (step != null ? "Go to " + fmtW(W + step) + " " + unit : "Add " + ex.up) +
        " only if your knee stayed at 3/10 or less and was pain-free next morning.";
    } else if (step != null) {
      var nw = W + step;
      sg.kind = "add"; sg.work = nw; sg.pw = fmtW(nw); sg.pr = ex.lo + "-" + ex.hi;
      sg.text = "Try " + fmtW(nw) + " " + unit + " × " + ex.lo + "-" + ex.hi + rep + per + "  (+" + fmtW(step) + ")";
      sg.note = "Top of range hit on every set last time.";
    } else {
      sg.kind = "add"; sg.pr = ex.lo + "-" + ex.hi;
      sg.text = "Top of range hit. Add " + ex.up + ".";
      sg.note = "";
    }
    return sg;
  }
  function warmPh(dayId, ex) {
    if (ex.warm.bw) return "BW";
    var sg = suggest(dayId, ex);
    var base = sg ? sg.work : 0;
    return base ? String(Math.round(base * ex.warm.pct / 10) / 10) : (ex.unit || "kg");
  }
  function wtxt(s) { return s.w ? s.w + (s.u || "kg") : "BW"; }
  function setsText(ex, arr) {
    return arr.map(function (s) {
      if (ex.perLeg) return wtxt(s) + " R" + s.r + "/L" + s.l;
      return wtxt(s) + "×" + s.r + (ex.timed ? "s" : "");
    }).join("   ");
  }
  function hintFor(dayId, ex) {
    var f = lastFor(dayId, ex);
    if (!f) return { text: ex.warm && ex.knee ? "First session: use about 70% of your old weight." : "No earlier record yet.", sg: null };
    var s = f.s;
    var when = new Date(s.ts).toLocaleDateString("en-IN", { day: "numeric", month: "short" });
    if (f.cross && PLAN[s.dayId]) when += ", " + PLAN[s.dayId].label;
    return { text: "Last (" + when + "): " + setsText(ex, s.sets[ex.id]), sg: suggest(dayId, ex) };
  }
  function defFor(day, id) {
    var hit = day && day.ex.filter(function (e) { return e.id === id; })[0];
    return hit || CAT[id] || { id: id, name: id };
  }
  function volume(setsObj, dayId) {
    var total = 0;
    var day = PLAN[dayId];
    Object.keys(setsObj || {}).forEach(function (exId) {
      var ex = defFor(day, exId);
      if (ex.timed) return;
      setsObj[exId].forEach(function (s) {
        total += (s.w || 0) * (s.u === "lb" ? LB : 1) * ((s.r || 0) + (ex.perLeg ? (s.l || 0) : 0));

  function draftTally() {

      });

  }

  /* ---------- toast ---------- */
  function toast(msg, isErr) {
    var t = $("#toast");
    t.textContent = msg;
    t.className = "toast" + (isErr ? " err" : "");
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, isErr ? 5000 : 2600);
  }

  /* ---------- render: week + day ---------- */
  function renderWeek() {
    var wrap = $("#week");
    wrap.replaceChildren();
    var todayDow = now.getDay();
    WEEK.forEach(function (w, i) {
      var cls = "chip" + (w.id ? "" : " rest") + (w.dow === todayDow ? " is-today" : "");
      wrap.append(h("button", {
        "class": cls, type: "button", "aria-pressed": i === selected ? "true" : "false",
        onclick: function () { selectDay(i); }
      },
        h("span", { "class": "dow", text: DOW_NAMES[w.dow] }),
        h("span", { "class": "nm", text: w.short }),
        h("span", { "class": "tick" })
      ));
    });
  }

  function doSwap(dayId, slot, t) {
    var used = {};
    PLAN[dayId].ex.forEach(function (s2) { if (s2 !== slot) used[activeEx(s2).id] = true; });
    if (!CAT[t] || used[t]) {
      toast("That exercise is already on today's list.", true);
      renderCard(dayId, slot);
      return;
    }
    var prev = activeEx(slot);
    var had = hasData(prev);
    if (t === slot.id) delete draft.swap[slot.id]; else draft.swap[slot.id] = t;
    ensureEx(activeEx(slot));
    swapOpen[dayId + ":" + slot.id] = false;
    persistDraft();
    renderCard(dayId, slot);
    renderTally();
    toast(had ? "Sets typed for " + prev.name + " are kept, but not saved while it is swapped out."
      : (t === slot.id ? "Back to the planned exercise." : "Swapped for this session only. It resets when you save."));
  }

  function swapSelect(dayId, slot) {
    var used = {};
    PLAN[dayId].ex.forEach(function (s2) { if (s2 !== slot) used[activeEx(s2).id] = true; });
    var sel = h("select", {
      "class": "sel wide", id: "swap-" + dayId + "-" + slot.id,
      onchange: function (e) { doSwap(dayId, slot, e.target.value); }
    });
    GROUPS.forEach(function (g) {
      var og = h("optgroup", { label: g.label });
      g.ids.forEach(function (id) {
        var dis = !!used[id];
        og.append(h("option", {
          value: id, disabled: dis,
          text: CAT[id].name + (id === slot.id ? " (planned here)" : "") + (dis ? " (already on today's list)" : "")
        }));
      });
      sel.append(og);
    });
    sel.value = activeEx(slot).id;
    return sel;
  }

  function exCard(dayId, slot) {
    var ex = activeEx(slot);
    var swapped = ex !== slot;
    var key = dayId + ":" + slot.id;
    var cols = ex.perLeg ? 3 : 2;
    var sets = draft.sets[ex.id];
    var unit = ex.unit || "kg";
    var repWord = ex.timed ? "sec" : "reps";
    var wu = ex.warm ? draft.warm[ex.id] : null;
    var cur = hintFor(dayId, ex);
    var grid = h("div", { "class": "grid", style: "--cols:" + cols });

    function phFor(kind) {
      var sg = cur.sg;
      if (kind === "w") return sg && sg.pw ? sg.pw : unit;
      if (kind === "r") return sg ? sg.pr : ex.lo + "-" + ex.hi;
      if (kind === "warm") return warmPh(dayId, ex);
      return "";
    }
    function field(obj, key, ph, kind, mode, id, label, cls) {
      var el = h("input", {

        placeholder: ph, value: obj[key], "aria-label": label,

      });

    }
    function build() {
      grid.replaceChildren();
      var head = [h("span"), h("span", { "class": "colhead", text: unit }),
        h("span", { "class": "colhead", text: ex.perLeg ? repWord + " R" : repWord })];
      if (ex.perLeg) head.push(h("span", { "class": "colhead", text: repWord + " L" }));
      head.forEach(function (c) { grid.append(c); });
      if (wu) {
        var wb = "in-" + dayId + "-" + ex.id + "-warm";
        var wrow = [
          h("span", { "class": "setn w", title: "Warm-up set", text: "W" }),
          field(wu, "w", phFor("warm"), "warm", "decimal", wb + "-w", ex.name + ", warm-up, " + unit, "warm"),
          field(wu, "r", ex.warm.r, null, "numeric", wb + "-r", ex.name + ", warm-up, " + repWord, "warm")
        ];
        if (ex.perLeg) wrow.push(field(wu, "l", ex.warm.r, null, "numeric", wb + "-l", ex.name + ", warm-up, " + repWord + " left", "warm"));
        wrow.forEach(function (c) { grid.append(c); });
      }
      sets.forEach(function (s, i) {
        var base = "in-" + dayId + "-" + ex.id + "-" + i;
        var isDrop = ex.drop && i >= ex.sets;
        var nm = ex.name + (isDrop ? ", drop set, " : ", set " + (i + 1) + ", ");
        var row = [
          h("span", { "class": isDrop ? "setn w" : "setn", text: isDrop ? "D" : String(i + 1) }),
          field(s, "w", phFor("w"), "w", "decimal", base + "-kg", nm + unit),
          field(s, "r", phFor("r"), "r", "numeric", base + "-reps", nm + repWord)
        ];
        if (ex.perLeg) row.push(field(s, "l", phFor("r"), "r", "numeric", base + "-repsL", nm + repWord + " left"));
        row.forEach(function (c) { grid.append(c); });
      });
    }
    build();

    var hintEl = h("p", { "class": "hint" });
    var tryEl = h("p", { "class": "try" });
    function refresh() {
      cur = hintFor(dayId, ex);
      hintEl.textContent = cur.text;
      tryEl.replaceChildren();
      var sg = cur.sg;
      tryEl.hidden = !sg;
      if (sg) {
        tryEl.className = "try" + (sg.kind === "add" ? " add" : "");
        tryEl.append(h("b", { text: sg.text }));
        if (sg.note) tryEl.append(h("span", { "class": "why", text: sg.note }));
      }

    }

    var planRows = [];
    if (ex.warm) planRows.push(h("dt", { text: "Warm-up" }), h("dd", { text: (ex.warm.bw ? "Bodyweight" : (ex.warm.label || ex.warm.pct + "% of your working weight")) + ", " + ex.warm.r + " reps" + (ex.perLeg ? " per leg" : "") }));
    if (ex.drop) planRows.push(h("dt", { text: "Drop set" }), h("dd", { text: "Right after set 3, cut the weight by about 20-25% and go to failure with no rest. Log it in row D. It does not count toward adding weight." }));
    if (ex.partial) planRows.push(h("dt", { text: "Range" }), h("dd", { text: "Bottom half only. If it ever feels too easy, add weight by the same rule." }));
    planRows.push(h("dt", { text: "Add" }), h("dd", { text: ex.up + " when you hit " + ex.hi + (ex.timed ? " s" : " reps") + " on all " + ex.sets + " sets" }));

    var isOpen = !!swapOpen[key];
    var bar = h("div", { "class": "exbar" },
      h("button", { "class": "addset", type: "button", onclick: function () {

        h("span", { "class": "target", text: ex.sets + (ex.drop ? " + drop" : "") + " × " + ex.lo + "-" + ex.hi + (ex.timed ? " s" : "") + (ex.perLeg ? " /leg" : "") })
      ),

  function renderCard(dayId, slot) {

  }

  function renderDay() {

        h("div", { "class": "dayhead" }, h("h2", { text: info.title }), h("p", { text: DOW_NAMES[w.dow] + " is not a lifting day." })),
        h("div", { "class": "note" }, h("strong", { text: info.title + ". " }), info.text, " Pick a lifting day above to log sets.")
      );

    body.append(h("div", { "class": "dayhead" },
      h("h2", { text: day.label }),
      h("p", { text: DOW_NAMES[w.dow] + " · " + day.sub })
    ));
    if (day.lower) {
      body.append(h("div", { "class": "note" },
        h("strong", { text: "Warm-up. " }),

      ));
      body.append(h("div", { "class": "note" },
        h("strong", { text: "Knee plan. " }),

      ));
    } else if (day.note) {

    } else {
      body.append(h("div", { "class": "note" },
        h("strong", { text: "Warm-up. " }),

      ));
    }

  function renderTally() {
    var t = draftTally();
    var el = $("#tally");
    el.replaceChildren();
    if (!curId()) { el.textContent = "Rest day"; $("#savebtn").disabled = true; return; }
    el.append(h("b", { text: String(t.n) }), t.n === 1 ? " set" : " sets", " · ", h("b", { text: fmtKg(t.vol) }), " kg volume");

  /* Called when saved sessions change: refresh the last-session line, the suggestion and the placeholders in place. */
  function updateHints() {
    document.querySelectorAll(".ex").forEach(function (el) { if (el._refresh) el._refresh(); });
  }

  /* ---------- render: history ---------- */
  function renderHistory() {
    var root = $("#history");
    root.replaceChildren();
    var cnt = $("#histcount");
    cnt.textContent = sessions.length ? String(Math.min(sessions.length, SHOW)) : "";
    $("#histnote").textContent = !store ? "Loading your sessions..." :
      (store.mode === "db" ? "Last 7 sessions, saved to your account." : "Last 7 sessions, saved on this device only.");
    if (!sessions.length) {
      root.append(h("div", { "class": "empty" },
        h("h3", { text: store ? "No sessions yet" : "Loading" }),
        h("p", { text: store ? "Log your sets on the Log tab and press Save session. Your last 7 sessions show up here." : "Fetching your saved sessions." })
      ));
      return;
    }
    sessions.slice(0, SHOW).forEach(function (s) {
      var day = PLAN[s.dayId];
      var isOpen = !!open[s.id];
      var nSets = 0;
      Object.keys(s.sets || {}).forEach(function (k) { nSets += s.sets[k].length; });
      var card = h("article", { "class": "sess" },
        h("button", { "class": "sesshead", type: "button", "aria-expanded": isOpen ? "true" : "false", onclick: function () {
          open[s.id] = !open[s.id]; renderHistory();
        } },
          h("span", { "class": "l" }, h("span", { "class": "t", text: s.label || (day && day.label) || "Session" }), h("span", { "class": "d", text: fmtDate(s.ts) })),
          h("span", { "class": "r" }, nSets + " sets", h("br"), fmtKg(volume(s.sets, s.dayId)) + " kg")
        )
      );
      if (isOpen) {
        var bodyEl = h("div", { "class": "sessbody" });
        /* Planned exercises first, then anything swapped in that day. */
        var keys = Object.keys(s.sets || {}), order = [];
        if (day) day.ex.forEach(function (e) { if (keys.indexOf(e.id) >= 0) order.push(e.id); });
        keys.forEach(function (k) { if (order.indexOf(k) < 0) order.push(k); });
        order.forEach(function (k) {
          var arr = s.sets[k];
          if (!arr || !arr.length) return;
          var ex = defFor(day, k);
          var wm = s.warm && s.warm[k];
          bodyEl.append(h("div", { "class": "hx" }, h("span", { "class": "n", text: ex.name }),
            h("span", { "class": "s", text: (wm ? "W " + setsText(ex, [wm]) + "   |   " : "") + setsText(ex, arr) })));
        });
        if (day && day.lower) {
          var ks = h("select", { "class": "sel", id: "kn-" + s.id, onchange: function (e) {
            var v = e.target.value === "" ? null : Number(e.target.value);
            store.update(s.id, { kneeNext: v }).catch(function () { toast("Could not save the rating. Try again.", true); });
          } });
          ks.append(h("option", { value: "", text: "Not rated" }));
          for (var i = 0; i <= 10; i++) ks.append(h("option", { value: String(i), text: i + " / 10" }));
          ks.value = s.kneeNext == null ? "" : String(s.kneeNext);
          bodyEl.append(h("div", { "class": "kneeline" },
            "Knee during: " + (s.knee == null ? "not rated" : s.knee + " / 10"),
            h("label", { "for": "kn-" + s.id, text: "Next morning:" }), ks));
        }
        var delBtn = h("button", { "class": "del" + (sureDel === s.id ? " sure" : ""), type: "button", onclick: function () {
          if (sureDel !== s.id) { sureDel = s.id; renderHistory(); return; }
          sureDel = null;
          store.remove(s.id).then(function () { toast("Session deleted"); }).catch(function () { toast("Could not delete. Try again.", true); });
        } }, sureDel === s.id ? "Tap again to delete" : "Delete session");
        bodyEl.append(delBtn);
        card.append(bodyEl);
      }
      root.append(card);
    });
  }

  /* ---------- navigation ---------- */
  function selectDay(i) {
    flushDraft();
    selected = i;
    loadDraft();
    renderWeek();
    renderDay();
    renderTally();
  }
  function setTab(t) {
    tab = t;
    $("#tab-log").setAttribute("aria-selected", t === "log" ? "true" : "false");
    $("#tab-hist").setAttribute("aria-selected", t === "hist" ? "true" : "false");
    $("#view-log").hidden = t !== "log";
    $("#view-hist").hidden = t !== "hist";
    $("#savebar").hidden = t !== "log";
    if (t === "hist") renderHistory();
  }

  /* ---------- save ---------- */
  function saveSession() {
    var id = curId();
    if (!id || saving) return;
    var day = PLAN[id];
    var out = {}, warmOut = {}, n = 0;
    activeList(id).forEach(function (ex) {
      var arr = [];
      function mk(s) {
        var r = int(s.r), l = ex.perLeg ? int(s.l) : 0;
        if (!(r > 0 || l > 0)) return null;
        var o = { w: num(s.w), r: r };
        if (ex.perLeg) o.l = l;
        if (ex.unit === "lb") o.u = "lb";
        return o;
      }
      (draft.sets[ex.id] || []).forEach(function (s) { var o = mk(s); if (o) arr.push(o); });
      if (arr.length) { out[ex.id] = arr; n += arr.length; }
      var wo = ex.warm && draft.warm && draft.warm[ex.id] ? mk(draft.warm[ex.id]) : null;
      if (wo) warmOut[ex.id] = wo;
    });
    if (!n) { toast("Log at least one set with reps first.", true); return; }
    var doc = {
      ts: Date.now(), dayId: id, label: day.label, sets: out, warm: warmOut,
      knee: day.lower && draft.knee !== "" ? Number(draft.knee) : null,
      kneeNext: null
    };
    saving = true;
    $("#savebtn").disabled = true;
    store.save(doc).then(function () {
      saving = false;
      clearTimeout(draftTimer);
      lsDel("splitlog.draft." + id);
      draft = newDraft();      /* drops the swaps: the planned exercises come back */
      swapOpen = {};
      loadDraft();
      renderDay();
      renderTally();
      toast("Session saved");
      open = {}; open[doc.id || ("s" + doc.ts)] = true;
      setTab("hist");
      window.scrollTo(0, 0);
    }).catch(function () {
      saving = false;
      renderTally();
      toast("Could not save. Check your connection and try again.", true);
    });
  }

  /* ---------- storage ---------- */
  function localStore() {
    var KEY = "splitlog.sessions";
    function read() { try { return JSON.parse(lsGet(KEY) || "[]"); } catch (e) { return []; } }
    function write(a) { lsSet(KEY, JSON.stringify(a.slice(0, KEEP))); }
    function publish() {
      sessions = read().sort(function (a, b) { return b.ts - a.ts; }).slice(0, KEEP);
      onSessions();
    }
    return {
      mode: "local",
      start: function () { publish(); },
      save: function (doc) { doc.id = "s" + doc.ts; var a = read(); a.unshift(doc); write(a); publish(); return Promise.resolve(); },
      update: function (id, patch) { var a = read().map(function (s) { return s.id === id ? Object.assign({}, s, patch) : s; }); write(a); publish(); return Promise.resolve(); },
      remove: function (id) { write(read().filter(function (s) { return s.id !== id; })); publish(); return Promise.resolve(); }
    };
  }
  function dbStore(db, uid) {
    var col = db.collection("data/users/" + uid);
    var loadTimer = null;
    return {
      mode: "db",
      start: function () {
        loadTimer = setTimeout(function () {
          $("#histnote").textContent = "Cannot reach your saved sessions yet. What shows may be out of date.";
        }, 10000);
        col.orderBy("ts", "desc").limit(KEEP).onSnapshot(function (snap) {
          if (!snap.metadata.fromCache) clearTimeout(loadTimer);
          sessions = snap.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
          onSessions();
        }, function () {
          clearTimeout(loadTimer);
          $("#histnote").textContent = "Saved sessions are not available right now.";
        });
      },
      save: function (doc) { return col.doc("s" + doc.ts).set(doc); },
      update: function (id, patch) { return col.doc(id).update(patch); },
      remove: function (id) { return col.doc(id).delete(); }
    };
  }
  function onSessions() {
    $("#histcount").textContent = sessions.length ? String(Math.min(sessions.length, SHOW)) : "";
    updateHints();
    if (tab === "hist") renderHistory();
  }

  async function initStore() {
    var db = null, uid = null;
    try {
      if (window.claude && window.claude.use) {
        db = await window.claude.use("db");
        var user = await window.claude.use("user");
        uid = user ? await user.id() : null;
      }
    } catch (e) { db = null; }
    store = db && uid ? dbStore(db, uid) : localStore();
    store.start();
    renderHistory();
  }

  /* ---------- boot ---------- */
  $("#today").textContent = now.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  $("#tab-log").addEventListener("click", function () { setTab("log"); });
  $("#tab-hist").addEventListener("click", function () { setTab("hist"); });
  $("#savebtn").addEventListener("click", saveSession);
  loadDraft();
  renderWeek();
  renderDay();
  renderTally();
  renderHistory();
  initStore();
})();
</script>

</body></html>
